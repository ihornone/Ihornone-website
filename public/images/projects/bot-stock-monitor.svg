<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1514" />
      <stop offset="50%" stop-color="#2A1E1E" />
      <stop offset="100%" stop-color="#140F0E" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D09AFC" />
      <stop offset="100%" stop-color="#F28C38" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362826" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#241918" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Decorative Glowing Circles -->
  <circle cx="200" cy="180" r="140" fill="#D09AFC" fill-opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="550" r="180" fill="#F28C38" fill-opacity="0.1" filter="blur(80px)" />

  <!-- Center Presentation Card -->
  <rect x="150" y="100" width="900" height="550" rx="28" fill="url(#cardGrad)" stroke="#D09AFC" stroke-opacity="0.25" stroke-width="2" />

  <!-- Header Section in Card -->
  <rect x="200" y="150" width="60" height="60" rx="16" fill="url(#accent)" />
  <text x="230" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#1A1514" text-anchor="middle">⚡</text>

  <text x="280" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#FAF1EC">E-Commerce Stock Scraper Bot</text>
  <text x="280" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#D09AFC">Automated Multi-Region Inventory &amp; Anti-Bot Bypass</text>

  <!-- Badges -->
  <g transform="translate(200, 245)">
    <rect width="130" height="34" rx="8" fill="#1F1716" stroke="#D09AFC" stroke-opacity="0.3" />
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Playwright Stealth</text>

    <rect x="145" width="100" height="34" rx="8" fill="#1F1716" stroke="#D09AFC" stroke-opacity="0.3" />
    <text x="195" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">TypeScript</text>

    <rect x="260" width="100" height="34" rx="8" fill="#1F1716" stroke="#D09AFC" stroke-opacity="0.3" />
    <text x="310" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Telegraf</text>

    <rect x="375" width="100" height="34" rx="8" fill="#1F1716" stroke="#D09AFC" stroke-opacity="0.3" />
    <text x="425" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Supabase</text>

    <rect x="490" width="90" height="34" rx="8" fill="#1F1716" stroke="#D09AFC" stroke-opacity="0.3" />
    <text x="535" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Docker</text>
  </g>

  <!-- Telegram Simulation Card UI -->
  <g transform="translate(200, 310)">
    <!-- Simulated Message Box 1 -->
    <rect width="460" height="135" rx="16" fill="#1A1312" stroke="#ffffff" stroke-opacity="0.08" />
    <circle cx="30" cy="30" r="14" fill="#2AABEE" />
    <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TG</text>
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#2AABEE">Stock Monitoring Alert</text>
    <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#FAF1EC">🔥 Товар знову з'явився в наявності!</text>
    <text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#E8856A">Розмір: L | Регіон: PL (Польща) | Ціна: 149 PLN</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#999999">Статус: In Stock (миттєве сповіщення за 1.8 с)</text>

    <!-- Simulated Metrics Box Right -->
    <g transform="translate(480, 0)">
      <rect width="320" height="135" rx="16" fill="#1A1312" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#D09AFC">ПРОДУКТИВНІСТЬ СИСТЕМИ</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#FAF1EC">99.8%</text>
      <text x="25" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FAF1EC" fill-opacity="0.7">Успішний обхід Cloudflare/WAF</text>
      <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#55D688">● 24/7 автономний моніторинг</text>
    </g>

    <!-- Bottom Feature Highlights -->
    <g transform="translate(0, 155)">
      <rect width="780" height="50" rx="12" fill="#241B1A" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">🛡️ Mutex Session Management</text>
      <text x="290" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">🌐 Proxy Geo-Rotation</text>
      <text x="540" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">⚡ Instant SKU Alerting</text>
    </g>
  </g>
</svg>
