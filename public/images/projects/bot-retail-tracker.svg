<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181C" />
      <stop offset="50%" stop-color="#192329" />
      <stop offset="100%" stop-color="#0F1418" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212F38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#18232A" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg2)" />

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Glowing background elements -->
  <circle cx="220" cy="180" r="140" fill="#38EF7D" fill-opacity="0.1" filter="blur(70px)" />
  <circle cx="980" cy="550" r="180" fill="#11998E" fill-opacity="0.12" filter="blur(80px)" />

  <!-- Center Card -->
  <rect x="150" y="100" width="900" height="550" rx="28" fill="url(#cardGrad2)" stroke="#38EF7D" stroke-opacity="0.25" stroke-width="2" />

  <!-- Header Section -->
  <rect x="200" y="150" width="60" height="60" rx="16" fill="url(#accent2)" />
  <text x="230" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0F1418" text-anchor="middle">📦</text>

  <text x="280" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#FAF1EC">Retail Inventory Tracker Bot</text>
  <text x="280" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#38EF7D">High-Concurrency Multi-Color Catalog Scraping Engine</text>

  <!-- Badges -->
  <g transform="translate(200, 245)">
    <rect width="130" height="34" rx="8" fill="#131B21" stroke="#38EF7D" stroke-opacity="0.3" />
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">p-limit Concurrency</text>

    <rect x="145" width="130" height="34" rx="8" fill="#131B21" stroke="#38EF7D" stroke-opacity="0.3" />
    <text x="210" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Akamai Solver</text>

    <rect x="290" width="100" height="34" rx="8" fill="#131B21" stroke="#38EF7D" stroke-opacity="0.3" />
    <text x="340" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">TypeScript</text>

    <rect x="405" width="100" height="34" rx="8" fill="#131B21" stroke="#38EF7D" stroke-opacity="0.3" />
    <text x="455" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">Telegraf</text>

    <rect x="520" width="100" height="34" rx="8" fill="#131B21" stroke="#38EF7D" stroke-opacity="0.3" />
    <text x="570" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FAF1EC" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Interactive Demo Area -->
  <g transform="translate(200, 310)">
    <!-- Telegram Interactive Size Picker Simulation -->
    <rect width="460" height="135" rx="16" fill="#11181D" stroke="#ffffff" stroke-opacity="0.08" />
    <circle cx="30" cy="30" r="14" fill="#2AABEE" />
    <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TG</text>
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#2AABEE">Interactive Size Picker</text>
    <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#FAF1EC">Оберіть розміри для відстеження:</text>
    
    <!-- Inline Button Grid Mock -->
    <g transform="translate(24, 78)">
      <rect width="50" height="28" rx="6" fill="#1A252C" stroke="#38EF7D" stroke-width="1.5" />
      <text x="25" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#38EF7D" text-anchor="middle">✓ S</text>

      <rect x="60" width="50" height="28" rx="6" fill="#1A252C" stroke="#38EF7D" stroke-width="1.5" />
      <text x="85" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#38EF7D" text-anchor="middle">✓ M</text>

      <rect x="120" width="50" height="28" rx="6" fill="#1A252C" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="145" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#888888" text-anchor="middle">L</text>

      <rect x="180" width="50" height="28" rx="6" fill="#1A252C" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="205" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#888888" text-anchor="middle">XL</text>

      <rect x="250" width="150" height="28" rx="6" fill="#11998E" />
      <text x="325" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">🚀 Зберегти відстеження</text>
    </g>

    <!-- Metrics Box Right -->
    <g transform="translate(480, 0)">
      <rect width="320" height="135" rx="16" fill="#11181D" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#38EF7D">ШВИДКІСТЬ ПАРСИНГУ</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#FAF1EC">&lt; 1.5 с</text>
      <text x="25" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FAF1EC" fill-opacity="0.7">Опитування складських залишків</text>
      <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#38EF7D">● Паралельна черга p-limit</text>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 155)">
      <rect width="780" height="50" rx="12" fill="#172128" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">⚡ Multi-Color SKU Extraction</text>
      <text x="290" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">🔒 Akamai Anti-Bot Handling</text>
      <text x="540" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FAF1EC">📊 Normalized Supabase Schema</text>
    </g>
  </g>
</svg>
